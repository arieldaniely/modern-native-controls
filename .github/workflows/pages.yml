name: Deploy marketing site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "modern-controls.css"
      - "modern-theme.js"
      - "modern-scrollbars.js"
      - "modern-date-picker.js"
      - "modern-single-select.js"
      - "modern-multi-select.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site and extension runtime
        run: |
          mkdir -p _site/extension
          cp -R docs/. _site/
          cp modern-controls.css modern-theme.js modern-scrollbars.js modern-date-picker.js modern-single-select.js modern-multi-select.js _site/extension/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
