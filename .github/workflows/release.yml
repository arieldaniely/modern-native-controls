name: Publish extension release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Build extension ZIP
        run: |
          zip modern-native-controls.zip \
            manifest.json modern-controls.css modern-style-guard.js modern-theme.js modern-scrollbars.js \
            modern-date-picker.js modern-single-select.js modern-multi-select.js \
            README.md LICENSE

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: modern-native-controls.zip
